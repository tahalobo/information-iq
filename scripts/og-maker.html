<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>صانع صور المعاينة</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@500;700&family=Reem+Kufi:wght@600&display=swap" rel="stylesheet">
<style>
  body { font-family: "IBM Plex Sans Arabic", sans-serif; background: #0b1224; color: #eee; padding: 24px; }
  canvas { width: 600px; height: auto; border-radius: 12px; margin: 8px; }
  button { font: inherit; padding: 10px 20px; border-radius: 10px; border: 0; background: #d4a537; cursor: pointer; }
</style>
</head>
<body>
<h1>صانع صور المعاينة (Open Graph)</h1>
<p>أداة محلية للمطوّر: ترسم صورة معاينة 1200×630 لكل معلومة ليس لها صورة، وتحفظها في <code>assets/img/og/</code>. شغّلها عبر خادم التطوير (<code>python .claude/dev_server.py</code>).</p>
<button id="go">إنشاء الصور وحفظها</button> <span id="status"></span>
<div id="out"></div>
<script src="../assets/js/config.js"></script>
<script src="../assets/js/data.js"></script>
<script>
const S = window.SITE, W = 1200, H = 630;
const cat = (id) => CATEGORIES.find((c) => c.id === id) || { name: "", c1: "#1b2a4d", c2: "#3a5a9a" };

function crown(x, cx, cy, s) {
  x.save(); x.translate(cx, cy); x.scale(s, s);
  const g = x.createLinearGradient(-20, -20, 20, 20); g.addColorStop(0, "#f3d27a"); g.addColorStop(1, "#b8860b");
  x.fillStyle = "#0e1a33"; x.beginPath(); x.roundRect(-30, -30, 60, 60, 16); x.fill();
  x.strokeStyle = "rgba(212,165,55,.6)"; x.lineWidth = 1.5; x.stroke();
  x.fillStyle = g; x.beginPath(); x.moveTo(-17, 8); x.lineTo(-19, -11); x.lineTo(-8.5, -2); x.lineTo(0, -16); x.lineTo(8.5, -2); x.lineTo(19, -11); x.lineTo(17, 8); x.closePath(); x.fill();
  x.beginPath(); x.roundRect(-17, 11, 34, 5, 2.5); x.fill();
  x.restore();
}

function wrap(x, text, maxW, maxLines) {
  const words = text.split(/\s+/); const lines = []; let line = "";
  for (const w of words) {
    const t = line ? line + " " + w : w;
    if (x.measureText(t).width > maxW && line) { lines.push(line); line = w; } else line = t;
  }
  if (line) lines.push(line);
  if (lines.length > maxLines) { lines.length = maxLines; lines[maxLines - 1] = lines[maxLines - 1].replace(/\s+\S*$/, "") + "…"; }
  return lines;
}

function draw(item) {
  const c = document.createElement("canvas"); c.width = W; c.height = H; const x = c.getContext("2d");
  const k = item.cat ? cat(item.cat) : { c1: "#0e1a33", c2: "#24365f" };
  const bg = x.createLinearGradient(0, 0, W, H); bg.addColorStop(0, "#0b1224"); bg.addColorStop(1, "#16254a");
  x.fillStyle = bg; x.fillRect(0, 0, W, H);
  // Mesopotamian diamond pattern
  x.strokeStyle = "rgba(212,165,55,.07)"; x.lineWidth = 2;
  for (let yy = -60; yy < H + 60; yy += 70) for (let xx = -60; xx < W + 60; xx += 70) { x.beginPath(); x.moveTo(xx, yy - 30); x.lineTo(xx + 30, yy); x.lineTo(xx, yy + 30); x.lineTo(xx - 30, yy); x.closePath(); x.stroke(); }
  // category glow + side bar
  const glow = x.createRadialGradient(200, 120, 20, 200, 120, 520); glow.addColorStop(0, k.c2 + "66"); glow.addColorStop(1, "transparent");
  x.fillStyle = glow; x.fillRect(0, 0, W, H);
  const bar = x.createLinearGradient(0, 0, 0, H); bar.addColorStop(0, "#f3d27a"); bar.addColorStop(1, "#b8860b");
  x.fillStyle = bar; x.fillRect(W - 16, 0, 16, H);

  x.direction = "rtl"; x.textAlign = "right";
  // brand
  crown(x, W - 100, 92, 1.25);
  x.fillStyle = "#f3efe2"; x.font = "600 34px 'Reem Kufi'"; x.fillText(S.name, W - 150, 90);
  x.fillStyle = "#d4a537"; x.font = "500 22px 'IBM Plex Sans Arabic'"; x.direction = "ltr"; x.textAlign = "right"; x.fillText("@" + S.handle, W - 150, 124);
  x.direction = "rtl";
  // category chip
  if (item.chip) {
    x.font = "700 24px 'IBM Plex Sans Arabic'"; const tw = x.measureText(item.chip).width;
    x.fillStyle = k.c2 + "40"; x.beginPath(); x.roundRect(W - 70 - tw - 36, 186, tw + 36, 46, 23); x.fill();
    x.fillStyle = "#f3d27a"; x.fillText(item.chip, W - 88, 218);
  }
  // title
  x.fillStyle = "#ffffff"; x.font = "700 56px 'IBM Plex Sans Arabic'";
  const lines = wrap(x, item.title, W - 200, 3);
  lines.forEach((l, i) => x.fillText(l, W - 70, 310 + i * 80));
  // footer
  x.fillStyle = "rgba(255,255,255,.6)"; x.font = "500 24px 'IBM Plex Sans Arabic'";
  x.fillText(item.footer || S.tagline, W - 70, H - 50);
  return c;
}

document.getElementById("go").onclick = async () => {
  await document.fonts.ready;
  const items = [{ id: "default", title: "كل ما هو حقيقي ومفيد: معلومات موثّقة وأدوات تحقق مجانية", chip: "الموقع الرسمي", footer: "علوم · تاريخ · ثقافة · أدوات كشف الصور والروابط" },
    ...FACTS.map((f) => ({ id: f.id, title: f.title, cat: f.cat, chip: cat(f.cat).name }))];
  const st = document.getElementById("status"); let ok = 0;
  for (const it of items) {
    const c = draw(it); document.getElementById("out").appendChild(c);
    const blob = await new Promise((r) => c.toBlob(r, "image/jpeg", .88));
    const res = await fetch(`../assets/img/og/${it.id}.jpg`, { method: "PUT", body: blob });
    if (res.ok) ok++; st.textContent = `حُفظت ${ok} من ${items.length}`;
  }
  st.textContent += " ✔";
};
</script>
</body>
</html>
