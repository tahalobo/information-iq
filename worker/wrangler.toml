# إعداد نشر عامل البحث العكسي:  npx wrangler deploy   (من داخل مجلد worker)
name = "empire-reverse"
main = "reverse-search.js"
compatibility_date = "2026-11-01"
workers_dev = true

# إلزامي: أصل موقعك (بلا مسار). بلا هذه القيمة يرفض العامل كل الطلبات.
# لأكثر من نطاق افصل بفاصلة، مثل: "https://tahalobo.github.io,https://example.com"
[vars]
ALLOWED_ORIGINS = "https://tahalobo.github.io"
