# مزامنة قنوات الإمبراطورية العراقية مع الموقع ونشره تلقائياً (مجاني على GitHub)
# كل نصف ساعة: سحب قناة المعلومات والفروع الستة وتصنيفها ← مصادر إضافية ← أسئلة الاختبار ← صفحة لكل منشور + مواضيع + sitemap + RSS ← تدقيق SEO ← نشر على GitHub Pages ← IndexNow
# ويعمل أيضاً عند كل تعديل ترفعه إلى main، ويمكن تشغيله يدوياً من Actions ← Telegram sync ← Run workflow
#
# الإعداد مرة واحدة: Settings ← Pages ← Source: GitHub Actions
name: Telegram sync

on:
  schedule:
    - cron: "*/30 * * * *"
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      pages:
        description: "عدد الصفحات المطلوب سحبها (كل صفحة ≈ 20 منشوراً)"
        required: false
        default: "3"

# أقل امتياز: لا صلاحيات افتراضية؛ كل مهمة تأخذ ما تحتاجه فقط (أسفل)
permissions: {}

concurrency:
  group: telegram-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # هذه المهمة تعالج محتوى غير موثوق (منشورات القنوات): تكتب في المستودع فقط، ولا تملك صلاحية النشر
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      # الـ actions مثبّتة برقم الـ commit (SHA) لا بالوسم: الوسم يمكن تحريكه إلى كود آخر، والـ SHA لا. Dependabot يحدّثها.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # رابط الموقع: من متغير المستودع SITE_URL إن وُجد (للدومين الخاص)، وإلا رابط GitHub Pages
      - name: Resolve site URL
        env:
          CUSTOM_URL: ${{ vars.SITE_URL }}
        run: |
          REPO="${GITHUB_REPOSITORY#*/}"
          if [ -n "$CUSTOM_URL" ]; then URL="$CUSTOM_URL";
          elif [ "$REPO" = "${GITHUB_REPOSITORY_OWNER}.github.io" ]; then URL="https://${GITHUB_REPOSITORY_OWNER}.github.io";
          else URL="https://${GITHUB_REPOSITORY_OWNER}.github.io/${REPO}"; fi
          echo "SITE_URL=$URL" >> "$GITHUB_ENV"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Fetch & classify channel posts
        if: github.event_name != 'push'
        # المدخل يمرّ كمتغيّر بيئة ويُقبل رقماً فقط (لا يُدرج نصّه داخل أمر الشل)
        env:
          PAGES_INPUT: ${{ github.event.inputs.pages }}
        run: |
          PAGES="${PAGES_INPUT:-3}"
          case "$PAGES" in ''|*[!0-9]*) echo "قيمة pages يجب أن تكون رقماً"; exit 1;; esac
          if [ "$PAGES" -gt 200 ]; then PAGES=200; fi
          node scripts/telegram-sync.mjs --pages "$PAGES"

      # فروع الإمبراطورية: الأخبار، الألعاب، الموسيقى، الأنمي، الرياضة (الخبر الكامل فقط، بلا إعلانات ولا فعاليات)
      - name: Fetch & filter the branch channels
        if: github.event_name != 'push'
        continue-on-error: true
        run: node scripts/branches-sync.mjs

      # مجموع مشتركي القنوات السبع على تليغرام (الرقم الذي يعرضه الموقع بدل متابعي إنستغرام)
      - name: Count Telegram subscribers
        continue-on-error: true
        run: node scripts/subscribers-sync.mjs

      # محرّك التوثيق: يبحث في الويب عن مصادر إضافية لأحدث المعلومات (5 منشورات في كل تشغيل)
      # المفاتيح اختيارية وتُضاف من Settings ← Secrets and variables ← Actions ← Secrets
      - name: Find extra sources on the web
        if: github.event_name != 'push'
        continue-on-error: true
        timeout-minutes: 8
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GOOGLE_CX: ${{ secrets.GOOGLE_CX }}
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
          BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
        run: node scripts/enrich-sources.mjs --limit 5

      - name: Fingerprint archive images (reverse search)
        run: |
          python3 -m pip install --quiet --only-binary=:all: "pillow==12.3.0"
          python3 scripts/build-image-index.py

      - name: Build quiz questions
        run: node scripts/build-quiz.mjs

      # صور المعاينة (Open Graph) تُرسم بمتصفح Chrome الموجود على خادم GitHub؛ نثبّت مكتبة التحكم فقط (بلا تنزيل متصفح)
      - name: Install preview-image renderer
        continue-on-error: true
        run: npm install --no-save --no-audit --no-fund --ignore-scripts puppeteer-core@23.11.1

      # صفحة لكل منشور + صفحات المواضيع والأرشيف + sitemap/RSS + البيانات المنظّمة (كل خبر جديد يأخذ SEO كاملاً تلقائياً)
      - name: Build static pages, topics, sitemaps & feeds
        run: node scripts/build-pages.mjs

      # مدقّق SEO: يوقف النشر إذا ظهر عنوان مكرر، أو canonical مفقود، أو رابط مكسور، أو بيانات منظّمة غير صالحة
      - name: SEO audit
        run: node scripts/seo-audit.mjs

      # مدقّق الأمان: يوقف النشر إذا ظهرت صفحة بلا سياسة أمن محتوى، أو سكربت خارجي، أو سكربت مضمّن غير معتمد،
      # أو رابط javascript:، أو مفتاح سري في المستودع، أو فشل أحد اختبارات الأمان
      - name: Security audit
        run: node scripts/security-audit.mjs

      - name: Commit changes
        id: commit
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "مزامنة تليغرام وتحديث الصفحات"
            git pull --rebase --autostash origin main
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "لا جديد"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  # النشر: عند وجود جديد من القناة، أو عند أي تعديل ترفعه، أو عند التشغيل اليدوي
  deploy:
    needs: sync
    if: needs.sync.outputs.changed == 'true' || github.event_name != 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 2
          persist-credentials: false
      # IndexNow: نحتفظ بالسكربت وقائمة الروابط الجديدة قبل حذف مجلد scripts، ونعرف هل تغيّرت القائمة في آخر commit
      - name: Stage IndexNow files
        id: indexnow
        run: |
          mkdir -p "$RUNNER_TEMP/indexnow/scripts"
          cp scripts/indexnow.mjs scripts/site.config.json "$RUNNER_TEMP/indexnow/scripts/" 2>/dev/null || true
          cp scripts/indexnow-pending.json "$RUNNER_TEMP/indexnow/scripts/" 2>/dev/null || true
          if git diff --quiet HEAD~1 HEAD -- scripts/indexnow-pending.json 2>/dev/null; then echo "fresh=false" >> "$GITHUB_OUTPUT"; else echo "fresh=true" >> "$GITHUB_OUTPUT"; fi
      - name: Keep only the website files
        run: rm -rf scripts worker .claude .github README.md SECURITY.md .gitignore .gitattributes
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
      # إخبار Bing و Yandex بالروابط الجديدة فوراً (مجاني بلا حساب). معطّل حتى تضع متغيّر المستودع INDEXNOW_ENABLED = true
      # من Settings ← Secrets and variables ← Actions ← Variables، بعد التأكد من النطاق النهائي للموقع.
      - name: Notify search engines (IndexNow)
        if: vars.INDEXNOW_ENABLED == 'true' && steps.indexnow.outputs.fresh == 'true'
        continue-on-error: true
        env:
          SITE_URL: ${{ vars.SITE_URL || steps.deployment.outputs.page_url }}
        run: |
          sleep 20
          cd "$RUNNER_TEMP/indexnow" && node scripts/indexnow.mjs --send
